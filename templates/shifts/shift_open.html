{% extends "base.html" %}
{% block title %}Открытие смены{% endblock %}
{% block breadcrumb %}Сменная работа / Смены / Приём смены{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <div class="card-header"><div class="card-title">Приём смены</div></div>
  <p class="muted">После открытия смены все новые обращения будут к ней привязаны.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Открыть смену</button>
      <a class="btn btn-ghost" href="{% url 'shifts:shift_list' %}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
