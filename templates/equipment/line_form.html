{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block breadcrumb %}<a href="{% url 'equipment:board' %}">Учет</a> / <a href="{% url 'equipment:board' %}">Оборудование</a> / {{ title }}{% endblock %}
{% block content %}
<div class="page-back">
  <a class="back-arrow" href="{{ cancel_url }}" title="Назад">←</a>
</div>
<div class="card" style="max-width:720px">
  <div class="card-header"><div class="card-title">{{ title }}</div></div>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Сохранить</button>
      <a class="btn btn-ghost" href="{{ cancel_url }}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
