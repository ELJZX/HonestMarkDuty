{% extends "base.html" %}
{% block title %}Склад{% endblock %}
{% block breadcrumb %}<a href="{% url 'inventory:board' %}">Учет</a> / <a href="{% url 'inventory:board' %}">Склад</a>{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">
    <div class="card-title">Каталог склада</div>
    <div class="card-header-actions">
      <a class="btn btn-sm btn-ghost" href="{% url 'inventory:board' %}">Склады</a>
      <a class="btn btn-primary btn-sm" href="{% url 'inventory:item_create' %}">+ Позиция</a>
    </div>
  </div>

  <form method="get" class="filters">
    <div class="form-row"><label>Поиск</label>
      <input class="field-input" name="q" value="{{ current.q }}" placeholder="наименование, №" data-live-search autocomplete="off">
    </div>
    <div class="form-row"><label>Склад</label>
      <select class="field-input field-select" name="storage" data-auto-submit>
        <option value="">Все</option>
        {% for s in storages %}<option value="{{ s.pk }}" {% if current.storage == s.pk|stringformat:'s' %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row"><label>Тип</label>
      <select class="field-input field-select" name="kind" data-auto-submit>
        <option value="">Все</option>
        {% for k in kinds %}<option value="{{ k.pk }}" {% if current.kind == k.pk|stringformat:'s' %}selected{% endif %}>{{ k.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row"><label>Состояние</label>
      <select class="field-input field-select" name="condition" data-auto-submit>
        <option value="">Все</option>
        {% for v, l in conditions %}<option value="{{ v }}" {% if current.condition == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select>
    </div>
  </form>

  <div id="items-results">
    {% include "inventory/partials/items_results.html" %}
  </div>
</div>
{% endblock %}
