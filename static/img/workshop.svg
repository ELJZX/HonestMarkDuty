    <rect x="372" y="200" width="26" height="24" rx="2"/>
    <rect x="414" y="200" width="26" height="24" rx="2"/>
    <rect x="456" y="200" width="26" height="24" rx="2"/>
    <rect x="372" y="248" width="26" height="24" rx="2"/>
    <rect x="414" y="248" width="26" height="24" rx="2"/>
